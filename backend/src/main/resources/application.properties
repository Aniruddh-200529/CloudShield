spring.application.name=cloudshield-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/cloudshield
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
cloudshield.cors.allowed-origin=${CLOUDSHIELD_CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
cloudshield.session.cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}
cloudshield.probe.api-key=${PROBE_API_KEY:}
cloudshield.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
cloudshield.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
cloudshield.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
cloudshield.alerts.cpu-threshold=${CPU_ALERT_THRESHOLD:85}
cloudshield.alerts.memory-threshold=${MEMORY_ALERT_THRESHOLD:90}
cloudshield.alerts.disk-threshold=${DISK_ALERT_THRESHOLD:90}
cloudshield.alerts.consecutive-samples=${ALERT_CONSECUTIVE_SAMPLES:2}
cloudshield.alerts.correlation-window-seconds=${ALERT_CORRELATION_WINDOW_SECONDS:300}
cloudshield.alerts.login-failure-threshold=${LOGIN_FAILURE_ALERT_THRESHOLD:10}
cloudshield.probe.stale-after-seconds=${PROBE_STALE_AFTER_SECONDS:180}
cloudshield.probe.stale-check-ms=${PROBE_STALE_CHECK_MS:60000}
cloudshield.probe.stale-initial-delay-ms=${PROBE_STALE_INITIAL_DELAY_MS:60000}
cloudshield.probe.stale-max-resources-per-run=${PROBE_STALE_MAX_RESOURCES_PER_RUN:1000}
