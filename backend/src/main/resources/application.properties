spring.application.name=cloudshield-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/cloudshield
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
cloudshield.probe.api-key=${PROBE_API_KEY:}
cloudshield.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
cloudshield.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
